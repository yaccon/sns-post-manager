name: v3.6 production integration checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'import34.js'
      - 'history342.js'
      - 'scripts/tests/release-v36-integration.test.mjs'
      - '.github/workflows/release-v36.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check storage compatibility, history split and restore safety
        run: node --test scripts/tests/release-v36-integration.test.mjs
