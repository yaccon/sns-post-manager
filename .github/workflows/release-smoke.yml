name: SNSアプリ 配布前チェック
on:
  pull_request:
    paths:
      - index.html
      - scripts/tests/release-batch-import.test.mjs
      - .github/workflows/release-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run app behavior tests
        run: node --test scripts/tests/release-batch-import.test.mjs
