name: iPhone コピー機能回帰テスト
on:
  pull_request:
    paths:
      - 'qa-iphone-v356.html'
      - 'scripts/tests/iphone-copy-v356.test.mjs'
      - '.github/workflows/iphone-copy-v356.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/iphone-copy-v356.test.mjs
